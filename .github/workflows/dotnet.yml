name: .NET

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: ['8.0.x']

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Check for vulnerable packages
      run: |
        # The command exits non-zero when advisories are found, hence || true —
        # but an empty file means the scan itself failed, which must not pass.
        dotnet list package --vulnerable --include-transitive > vulnerable.txt || true
        if [ ! -s vulnerable.txt ]; then
          echo "::error::Vulnerability scan produced no output — failing closed"
          exit 1
        fi
        cat vulnerable.txt
        # Fail on Critical/High advisories; Moderate/Low are reported but tolerated.
        if grep -E "^\s+>" vulnerable.txt | grep -E "Critical|High"; then
          echo "::error::Critical/High vulnerable NuGet packages detected — see log above"
          exit 1
        fi

    - name: Build
      run: dotnet build --configuration Release

    - name: Test
      run: dotnet test --configuration Release

    - name: Pack
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: dotnet pack --configuration Release --output ./nupkg

    - name: Upload artifacts
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./nupkg/*.nupkg
